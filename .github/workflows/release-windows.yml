name: Build & Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (e.g. v2.5.1)"
        required: true
        default: "v2.5.1"
        type: string
      draft:
        description: "Create as a draft release (hidden until published)"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout MetroVPN-for-Windows
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch Xray-core, tun2socks, Wintun & GeoIP assets
        shell: pwsh
        run: |
          ./scripts/fetch-core.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows installers (NSIS .exe + WiX .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Metrovpn ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: |
            ## Metrovpn Desktop for Windows 10/11 (x64)

            Powered by **Xray-core `v26.11.9`** and **Wintun (`tun2socks v2.7.0`)**.

            ### Downloads
            - **`Metrovpn_*_x64-setup.exe`** — Recommended NSIS Windows Installer (desktop/Start Menu shortcuts, WebView2 runtime check, clean uninstaller).
            - **`Metrovpn_*_x64_en-US.msi`** — WiX Windows Installer package.
            - **`Metrovpn-standalone-x64.exe`** — Single-file portable executable (auto-extracts `xray.exe`, `tun2socks.exe`, `wintun.dll`, `geoip.dat`, and `geosite.dat` to `%AppData%\site.metrodens.metrovpn\core\` on first launch).
            - **`Metrovpn-windows-x64-portable.zip`** — Portable folder archive with all binaries side-by-side.
            - **`SHA256SUMS.txt`** — SHA-256 verification checksums (`Get-FileHash <file> -Algorithm SHA256`).

            ### What's New in v2.5.0
            - **First-Run Onboarding Guide (`?`):** 3-step walkthrough for importing VLESS/VMess/Subscriptions, choosing System Proxy vs Wintun TUN Mode, and configuring Strict VCN / TLS Frag / System Tray.
            - **5-Tab Settings (v2rayN & NekoRay Style + MetroVPN Android Parity):** `General & Proxy`, `TUN & Routing` (`Rule`/`Global`/`Direct`, custom fragment, IPv6 control, Split Tunnel `.exe` exclusions), `DNS & Security` (`1.1.1.2`, bootstrap DNS, Mux, uTLS), `Subs & Speed`, and `About & Guide` (in-app update checker + Telegram links).
            - **Cleaner, Faster & Offline-Safe Desktop UI:** Removed dead dummy node, fixed last-node deletion, fixed window button hitboxes (`data-tauri-drag-region`), removed blocking remote Google Fonts, and prevented keystroke-induced tunnel drops.
            - **True Xray HTTP 204 Ping & Stronger Windows Proxy/TUN:** Real `generate_204` Xray latency testing, PAC (`AutoConfigURL`) backup/restore, `store=active` route fixes, and multi-IP server bypass pinning.

            > **SmartScreen Note:** If Windows Defender SmartScreen prompts on an unsigned build, verify the SHA-256 checksum against `SHA256SUMS.txt` and click **More info → Run anyway**.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: --target x86_64-pc-windows-msvc

      - name: Prepare gzip-compressed standalone payloads & build standalone Metrovpn.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/embedded" | Out-Null
          $files = @{
            "src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe"      = "src-tauri/embedded/xray.exe.gz"
            "src-tauri/binaries/tun2socks-x86_64-pc-windows-msvc.exe" = "src-tauri/embedded/tun2socks.exe.gz"
            "src-tauri/resources/wintun.dll"                          = "src-tauri/embedded/wintun.dll.gz"
            "src-tauri/resources/geoip.dat"                           = "src-tauri/embedded/geoip.dat.gz"
            "src-tauri/resources/geosite.dat"                         = "src-tauri/embedded/geosite.dat.gz"
          }
          foreach ($kv in $files.GetEnumerator()) {
            $inStream = [System.IO.File]::OpenRead($kv.Key)
            $outStream = [System.IO.File]::Create($kv.Value)
            $gzip = New-Object System.IO.Compression.GZipStream($outStream, [System.IO.Compression.CompressionLevel]::Optimal)
            $inStream.CopyTo($gzip)
            $gzip.Dispose(); $outStream.Dispose(); $inStream.Dispose()
          }
          npx tauri build --target x86_64-pc-windows-msvc --no-bundle --features custom-protocol,standalone-exe
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/metrovpn.exe" "Metrovpn-standalone-x64.exe" -Force

      - name: Package Portable ZIP & SHA256SUMS.txt
        shell: pwsh
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --no-bundle --features custom-protocol
          $outDir = "portable-stage"
          New-Item -ItemType Directory -Force -Path "$outDir/resources" | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/metrovpn.exe" "$outDir/Metrovpn.exe"
          Copy-Item "src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe" "$outDir/xray.exe"
          Copy-Item "src-tauri/binaries/tun2socks-x86_64-pc-windows-msvc.exe" "$outDir/tun2socks.exe"
          Copy-Item "src-tauri/resources/wintun.dll" "$outDir/wintun.dll"
          Copy-Item "src-tauri/resources/*" "$outDir/resources/"
          Compress-Archive -Path "$outDir/*" -DestinationPath "Metrovpn-windows-x64-portable.zip" -Force

          $hashTargets = @()
          $hashTargets += Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $hashTargets += Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $hashTargets += Get-Item "Metrovpn-standalone-x64.exe", "Metrovpn-windows-x64-portable.zip"
          $lines = foreach ($item in $hashTargets) {
            $h = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($item.Name)"
          }
          $lines | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Upload Standalone EXE, Portable ZIP & SHA256SUMS to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            Metrovpn-standalone-x64.exe
            Metrovpn-windows-x64-portable.zip
            SHA256SUMS.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metrovpn-Windows-x64
          path: |
            Metrovpn-standalone-x64.exe
            Metrovpn-windows-x64-portable.zip
            SHA256SUMS.txt
