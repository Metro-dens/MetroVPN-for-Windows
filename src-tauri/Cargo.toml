[package]
name = "metrovpn"
version = "2.7.4"
description = "Metrovpn Desktop — High-contrast Crimson Void VPN client powered by Xray-core"
authors = ["Metro Dens"]
edition = "2021"

[lib]
name = "metrovpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Used for production builds so Tauri embeds frontendDist instead of devUrl (http://localhost:1420)
custom-protocol = ["tauri/custom-protocol"]
standalone-exe = ["dep:flate2"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
futures-util = "0.3"
h2 = "0.4"
http = "1"
bytes = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = "0.9"
flate2 = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinInet",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
